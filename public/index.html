<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>JobCrush</title>
  <meta name="description" content="Swipe right on your future. JobCrush builds your career persona and finds jobs that actually match you." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💘</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500;1,9..144,600&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <a class="logo" href="#/" aria-label="JobCrush home"><span class="logo-heart">💘</span> Job<span>Crush</span></a>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode" title="Toggle dark mode">🌙</button>
  </header>

  <main id="app" tabindex="-1"></main>

  <nav class="tabbar" id="tabbar" hidden>
    <a href="#/swipe" data-tab="swipe"><span>🔥</span>Swipe</a>
    <a href="#/matches" data-tab="matches"><span>💌</span>Matches <b id="matchCount" class="badge" hidden></b></a>
    <a href="#/persona" data-tab="persona"><span>🪪</span>Persona</a>
    <a href="#/profile" data-tab="profile"><span>✏️</span>Profile</a>
  </nav>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="/app.js"></script>
</body>
</html>
